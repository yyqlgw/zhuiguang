<style>
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --text:#1B2233; --sub:#5D6478; --line:#E6EAF4;
  --primary:#2B5CE6; --primary2:#5C87FF; --deep:#0C1650;
  --h0:#EAEEF7; --h1:#BCCEFF; --h2:#6E92FF; --h3:#2B5CE6;
  --fs:16px;
}
body.dark{
  --bg:#101522; --card:#1A2130; --text:#E8EDF7; --sub:#A8B2C6; --line:#333C4E;
  --h0:#232C3E; --h1:#2E4790; --h2:#4265CC; --h3:#7FA0FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{background:#0C1650}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs);-webkit-text-size-adjust:100%;
  touch-action:manipulation;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none}
/* 输入框与正文允许选中，其余 UI 一律不可选，避免 iOS 快速点击时选中文字发蓝 */
input,textarea,.item,.mut,.foot,.q,.exp{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}
#hd{flex:none;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  background:linear-gradient(135deg,#0C1650 0%,#1E2F7E 45%,#4C7BFF 100%);
  color:#fff;position:relative;overflow:hidden;border-radius:0 0 26px 26px;}
#hd:before{content:"";position:absolute;right:-30px;top:-60px;width:180px;height:260px;
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0));
  transform:rotate(18deg);}
#hd .t{font-size:1.7em;font-weight:800;letter-spacing:1px;position:relative}
#hd .s{font-size:.74em;color:#B8C8FF;margin-top:6px;position:relative}
#hd .d{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px);
  font-size:.68em;color:#DCE6FF;background:rgba(255,255,255,.14);
  padding:6px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.22)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px 14px 22px}
#nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:8px 0 calc(6px + env(safe-area-inset-bottom))}
#nav div{flex:1;text-align:center;font-size:.68em;color:var(--sub);padding:4px 0}
#nav div.on{color:var(--primary);font-weight:700}
#nav .ic{display:block;font-size:1.35em;line-height:1.2}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 4px 18px rgba(16,28,60,.06)}
.hero{background:linear-gradient(135deg,#28409C,#4C7BFF);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
.hero .badge{display:inline-block;font-size:.68em;padding:4px 10px;border-radius:12px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28)}
.hero .num{font-size:2.5em;font-weight:800;line-height:1.1;margin-top:8px}
.hero .num small{font-size:.32em;font-weight:600;margin-left:4px}
.hero .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.hero .tip{font-size:.66em;color:#CFDCFF;margin-top:8px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 10px;font-size:.88em;
  font-weight:700;background:var(--primary);color:#fff;font-family:inherit}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line)}
.btn.gray{background:#E4E7F0;color:#9AA2B6}
.btn:active{opacity:.82}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:.72em;padding:7px 13px;border-radius:14px;background:var(--card);
  color:var(--sub);border:1px solid var(--line)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.pager::-webkit-scrollbar{display:none}
.pcard{flex:none;width:86%;scroll-snap-align:center;background:var(--card);border-radius:20px;
  overflow:hidden;box-shadow:0 6px 22px rgba(16,28,60,.10)}
.pcard .top{height:150px;background:linear-gradient(135deg,#2A44A8,#5C87FF);position:relative}
.pcard .top img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.pcard .top .init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:3.4em;font-weight:800;color:rgba(255,255,255,.9)}
.pcard .body{padding:14px}
.pcard h3{margin:0;font-size:1.15em}
.pcard .f{font-size:.68em;color:#fff;background:var(--primary);display:inline-block;
  padding:3px 9px;border-radius:10px;margin-top:6px}
.pcard .b{font-size:.78em;color:var(--sub);line-height:1.6;margin-top:10px}
.sec{font-size:.8em;font-weight:700;margin:16px 0 8px}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;font-size:.84em;line-height:1.7}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat .c{flex:1;background:var(--card);border-radius:16px;padding:12px 6px;text-align:center}
.stat .c b{display:block;font-size:1.15em;color:var(--primary)}
.stat .c span{font-size:.66em;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--bg);font-size:.66em;
  display:flex;align-items:center;justify-content:center;color:var(--sub)}
.cal div.ok{background:var(--primary);color:#fff;font-weight:700}
.cal div.hd{background:transparent;color:var(--sub);font-weight:700}
.heatWrap{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.heatLbl{display:grid;grid-template-rows:repeat(7,20px);gap:4px;font-size:.5em;color:var(--sub);
  align-items:center;justify-content:end;padding-right:2px;font-style:normal}
.heatLbl i{font-style:normal}
.heatBody{flex:1;min-width:0}
.heatMon{display:grid;grid-auto-flow:column;grid-auto-columns:20px;gap:4px;height:14px;
  font-size:.5em;color:var(--sub);align-items:end}
.heatMon i{display:block;line-height:1;white-space:nowrap}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:20px;grid-template-rows:repeat(7,20px);gap:4px}
.heat i{border-radius:5px;background:var(--h0);display:block;transition:transform .12s}
.heat i:active{transform:scale(.88)}
.heat i.lv1{background:var(--h1)}
.heat i.lv2{background:var(--h2)}
.heat i.lv3{background:var(--h3)}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat i.td{box-shadow:0 0 0 1.6px var(--primary)}
.heat i.emp{background:transparent}
.heatLg{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:.6em;color:var(--sub)}
.heatLg i{width:13px;height:13px;border-radius:4px;display:block}
.heatLg i.lv0{background:var(--h0)}
.heatLg i.lv1{background:var(--h1)}
.heatLg i.lv2{background:var(--h2)}
.heatLg i.lv3{background:var(--h3)}
.sheetWrap{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.sheetWrap.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg);border-radius:22px 22px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(14px);transition:transform .18s}
.sheetWrap.on .sheet{transform:none}
.sheet h2{margin:0 0 12px;font-size:1.05em}
.q{font-size:.95em;line-height:1.6;font-weight:700;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:10px;font-size:.86em;color:var(--text);font-family:inherit}
.opt.ok{border-color:#2E9E58;background:#E6F6EC;color:#1E7A42}
.opt.no{border-color:#D14343;background:#FDECEC;color:#B03030}
.exp{font-size:.78em;line-height:1.7;padding:12px;border-radius:12px;background:var(--card);margin-bottom:12px}
.result{background:linear-gradient(135deg,#5C87FF,#1B37A8);color:#fff;border-radius:20px;
  padding:22px;text-align:center;margin-bottom:14px}
.result b{font-size:2.2em;display:block}
.result span{font-size:.76em;color:#D6E1FF}
.mut{color:var(--sub);font-size:.72em;line-height:1.7}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;
  background:var(--card);color:var(--text);font-family:inherit;margin-bottom:10px}
#nav svg{display:block;margin:0 auto 2px;width:23px;height:23px}
#rotate{position:fixed;inset:0;background:#0C1650;color:#fff;z-index:99;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:.95em}
#rotate div{font-size:2.4em}
.foot{text-align:center;color:var(--sub);font-size:.66em;line-height:1.9;padding:14px 0 4px}
</style>
</head>

<script>
const DATA = {"people":[{"name":"黄芊芊","field":"芯片","brief":"北京大学研究员，深耕超低功耗微纳电子器件基础研究及产业转化，2023 年获第十八届中国青年女科学家奖。","detail":"黄芊芊长期从事后摩尔时代超低功耗微纳电子器件研究，提出多种新型器件与电路结构，并与国内产业界合作推进成果转化。她 17 岁考入北京大学，28 岁被聘为博士生导师，是国内自主培养的芯片领域青年领军人才。","points":["17 岁考入北京大学","28 岁成为博士生导师","2010 年起在王阳元、黄如院士指导下从事超低功耗器件研究"],"source":"北京大学新闻网《黄芊芊：芯片突围者》；北大集成电路学院新闻"},{"name":"徐颖","field":"北斗导航","brief":"中国科学院研究员，2006 年起参与北斗二号系统研究，长期从事北斗增强与终端技术研究。","detail":"徐颖 2006 年在导师带领下开始参与北斗二号卫星系统研究，博士毕业后进入中国科学院工作，2015 年成为当时中科院最年轻的博士生导师之一。她主要从事北斗增强与终端技术研究，同时长期投身科普，被网友称为“北斗女神”，但她更希望大家关注北斗系统本身。","points":["2006 年开始参与北斗二号研究","2015 年成为中科院最年轻的博导之一","长期从事北斗增强与终端技术研究"],"source":"中国科学报《徐颖：可否不叫我“北斗女神”？》；人民网报道"},{"name":"桂海潮","field":"航天","brief":"北京航空航天大学教授，中国空间站首位载荷专家，任务期间完成 68 项空间科学实验。","detail":"桂海潮是北京航空航天大学教授，作为中国空间站首位载荷专家执行载人飞行任务。任务期间他与乘组密切配合，完成 68 项空间科学实验，涵盖微重力流体物理、材料制备、生命科学等关键领域。返回教学科研一线后，他带领团队研究在轨服务、空间碎片监测与清除中的空间感知、运动规划和精细操控等关键技术。","points":["中国空间站首位载荷专家","任务期间完成 68 项空间科学实验","返回后研究在轨服务与空间碎片清除"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"赵洋","field":"深海装备","brief":"“奋斗者”号全海深载人潜水器副总设计师，2020 年下潜至 10909 米马里亚纳海沟。","detail":"赵洋任中国科学院沈阳自动化研究所正高级工程师、“奋斗者”号全海深载人潜水器副总设计师。针对深渊极端环境下大惯量载体的航行控制难题，他带领团队突破多项关键技术，完成“奋斗者”号控制系统的自主研制。2020 年 11 月，他搭乘“奋斗者”号下潜至 10909 米马里亚纳海沟。","points":["“奋斗者”号副总设计师","主持控制系统自主研制","2020 年下潜至 10909 米"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"金海族","field":"新能源电池","brief":"宁德时代航空和机器人电池技术中心部长，研制高比能锂离子电池并推动电芯 AI 智能设计。","detail":"金海族带领团队研制出高比能锂离子电池，能量密度达到国际先进水平，填补国内空白。2021 年她启动电芯 AI 智能设计系统研发，推动研发模式从“经验驱动”转向“数据与 AI 驱动”。","points":["研制高比能锂离子电池","2021 年启动电芯 AI 智能设计系统","推动研发从经验驱动转向数据驱动"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"陈蕾","field":"医学","brief":"四川大学华西医院主任医师，创建全球首个女性癫痫诊疗本体库。","detail":"育龄期女性癫痫患者的不孕率、孕期死亡率、后代畸胎率都显著高于普通女性。四川大学华西医院主任医师陈蕾带领团队创建全球首个女性癫痫诊疗本体库，突破癫痫预警关键技术，构建全生命周期管理体系，大幅降低患者不孕率与畸胎率。","points":["全球首个女性癫痫诊疗本体库","突破癫痫预警关键技术","构建全生命周期管理体系"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"于宗仁","field":"文物保护","brief":"敦煌研究院保护研究所所长，用原位无损分析技术为千年壁画“体检”。","detail":"于宗仁长期坚守石窟文物保护一线，提出“看得清、摸得透、管得住”的科研目标，推动文物保护从经验判断转向科学决策、从事后抢救转向提前预防。","points":["坚守敦煌石窟保护一线","提出“看得清、摸得透、管得住”","构建壁画健康评价与多维检测体系"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"黄桂云","field":"植物保护","brief":"长江生物多样性研究中心副主任，30 多年守护三峡珍稀植物，牵头保护濒危特有植物 2130 余种。","detail":"黄桂云在三峡濒危珍稀植物保护一线工作了 30 多年，牵头保护濒危特有植物 2130 余种，繁育苗木 32 万余株，建成国内最大濒危珍稀特有资源性种质资源库。","points":["保护濒危特有植物 2130 余种","繁育苗木 32 万余株","建成国内最大濒危植物种质资源库"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"孔海南","field":"生态治理","brief":"上海交通大学讲席教授，把“实验室”搬到洱海田间地头，10 多年每年驻守洱海超 200 天。","detail":"“科学研究必须立足于最真实的一线数据。”上海交通大学讲席教授孔海南为了科学推进洱海治理，把“实验室”搬到了田间地头，带领团队完成 3 万次采样、16 万次水质分析。","points":["把实验室搬到洱海田间地头","每年驻守洱海超过 200 天","完成 3 万次采样、16 万次水质分析"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"苏权科","field":"桥梁工程","brief":"港珠澳大桥工程总工程师，构建“港珠澳模型”耐久性设计理论。","detail":"港珠澳大桥要求 120 年设计寿命，工程总工程师苏权科带领团队攻克海洋环境下桥岛隧工程长寿命建造关键技术，构建起基于可靠度的耐久性设计理论，被国际同行称为“港珠澳模型”。","points":["港珠澳大桥工程总工程师","构建“港珠澳模型”耐久性设计理论","推动大桥数字化、智能化运维"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"徐洪杰","field":"核能与光源（前辈）","brief":"曾任中科院上海应用物理研究所所长，主持上海光源建设，后转向钍基熔盐堆研究。","detail":"徐洪杰曾任中国科学院上海应用物理研究所所长，担任过上海光源国家重大科学工程总经理、钍基熔盐堆核能系统先导专项负责人。上海光源建成开放后，他又转向核能领域的“无人区”——钍基熔盐堆。","points":["主持上海光源国家重大科学工程","转向钍基熔盐堆世界级难题","“实现国家需求就是科技工作者的天职”"],"source":"人民日报《走近“最美科技工作者”》"},{"name":"宋仁德","field":"畜牧科技","brief":"青海玉树州动物疫病预防控制中心主任，破解牦牛“三低”难题，被牧民称为“牦牛博士”。","detail":"宋仁德针对玉树牦牛“繁殖率低、出栏率低、牧民收益率低”的“三低”难题，研发推广牦牛“放牧+补饲”生态高效养殖技术，构建牦牛“三级繁育体系”。","points":["研发“放牧+补饲”生态高效养殖技术","构建牦牛三级繁育体系","参与选育“玉树牦牛”入选国家名录"],"source":"人民日报《走近“最美科技工作者”》"}],"quotes":[{"text":"实现国家需求就是科技工作者的天职。","author":"徐洪杰","note":"上海光源、钍基熔盐堆"},{"text":"科学家的使命，不仅是破解眼前的“卡脖子”难题，更要勇于构建支撑行业高质量发展的新范式。","author":"金海族","note":"宁德时代 · 航空电池"},{"text":"科学研究必须立足于最真实的一线数据。","author":"孔海南","note":"上海交大 · 洱海治理"},{"text":"港珠澳大桥是世界一流的物理大桥，未来，我们要将其建设成世界一流的数字化大桥。","author":"苏权科","note":"港珠澳大桥总工程师"},{"text":"我的事业在中国，我的成就在中国，我的归宿在中国。","author":"钱学森","note":"中国航天事业奠基人"},{"text":"振兴中华，乃我辈之责。","author":"黄大年","note":"地球物理学家 · 吉林大学"},{"text":"人就像一粒种子，要做一粒好种子。","author":"袁隆平","note":"杂交水稻之父"},{"text":"美丽的宇宙太空，以它的神秘和绚丽，召唤我们踏过平庸。","author":"南仁东","note":"FAST 工程首席科学家"},{"text":"我愿以身许国。","author":"王淦昌","note":"核物理学家 · 两弹一星元勋"},{"text":"聪明在于勤奋，天才在于积累。","author":"华罗庚","note":"数学家"},{"text":"真理，哪怕只见到一线，我们也不能让它的光辉变得暗淡。","author":"李四光","note":"地质学家"},{"text":"桥何名欤？曰奋斗。","author":"茅以升","note":"桥梁工程专家 · 钱塘江大桥"}],"knowledge":[{"title":"芯片制程","body":"7nm、5nm 指的是晶体管关键尺寸量级。数字越小，同样面积能塞下的晶体管越多，通常功耗更低、性能更好。"},{"title":"极紫外光刻","body":"先进制程用波长 13.5 nm 的极紫外光在晶圆上刻画电路，整套设备涉及光学、材料、精密运动等多个学科。"},{"title":"摩尔定律","body":"集成电路上可容纳的晶体管数目约每 18–24 个月翻一番，这是产业界长期遵循的经验规律，并非物理定律。"},{"title":"北斗三频","body":"北斗系统提供多频信号，多频组合可以更好地消除电离层误差，从而提高定位精度。"},{"title":"北斗短报文","body":"北斗具备短报文通信能力，在没有地面移动网络的区域也能发送简短消息，这是它区别于其他导航系统的特色之一。"},{"title":"中国天眼","body":"FAST 口径 500 米，是目前世界最大的单口径球面射电望远镜，主要观测脉冲星、中性氢等。"},{"title":"第一宇宙速度","body":"约 7.9 km/s，是航天器环绕地球运行所需的最小发射速度。"},{"title":"万米深潜","body":"马里亚纳海沟 10909 米处的水压约为 1100 个大气压，相当于每平方厘米承受约 1.1 吨的重量。"},{"title":"光电效应","body":"光照射金属表面使电子逸出。爱因斯坦用光量子假说解释了它，并因此获得诺贝尔物理学奖。"},{"title":"电池能量密度","body":"电池能量密度常用 Wh/kg 表示，数值越高，同样重量能储存的电能越多，这也是航空电池攻关的关键指标。"},{"title":"同步辐射光源","body":"电子在环形加速器中偏转时会发出高亮度辐射，可用于研究材料微观结构，上海光源即属此类装置。"},{"title":"空间微重力","body":"空间站上并非完全没有重力，而是处于持续自由落体状态，残余加速度很小，因此称为微重力环境。"},{"title":"半导体掺杂","body":"纯净硅的导电能力很弱，掺入微量杂质后导电性会大幅改变，形成 P 型或 N 型半导体，这是晶体管的基础。"},{"title":"纳米有多小","body":"1 纳米是十亿分之一米，大约相当于一根头发直径的几万分之一。芯片制程常用纳米作单位。"},{"title":"EDA 工具","body":"现代芯片动辄数十亿晶体管，设计必须依靠电子设计自动化（EDA）工具完成，它与光刻机同属产业链关键环节。"},{"title":"封装与测试","body":"芯片制造完成后还要经过封装和测试才能使用。封装起保护与电气连接作用，测试负责筛除不良品。"},{"title":"光刻胶","body":"光刻胶是光刻工序中的感光材料，曝光后发生化学变化，把掩膜上的电路图形固定到晶圆表面。"},{"title":"12 英寸晶圆","body":"目前主流晶圆直径为 300 毫米（约 12 英寸）。晶圆越大，一次能制作的芯片越多，单位成本越低。"},{"title":"5G 与毫米波","body":"5G 除使用中低频段，也可使用毫米波频段，带来更大带宽，但穿透与覆盖能力较弱，需要更密集的基站。"},{"title":"光纤通信","body":"光纤利用全反射把光信号约束在纤芯中传输，损耗低、带宽大，是现代通信骨干网的基础。"},{"title":"北斗全球开通","body":"2020 年 7 月 31 日，北斗三号全球卫星导航系统正式开通，服务范围覆盖全球。"},{"title":"四大导航系统","body":"全球四大卫星导航系统是中国的北斗、美国的 GPS、俄罗斯的 GLONASS 和欧盟的伽利略。"},{"title":"地球同步轨道","body":"同步轨道卫星运行周期约 24 小时，与地球自转同步，从地面看它几乎静止在天空某一位置。"},{"title":"北斗混合星座","body":"北斗采用地球静止轨道、倾斜地球同步轨道和中圆地球轨道卫星组成的混合星座，兼顾覆盖与精度。"},{"title":"第二宇宙速度","body":"约 11.2 km/s，是航天器脱离地球引力束缚所需的最小速度，也称逃逸速度。"},{"title":"第三宇宙速度","body":"约 16.7 km/s，是航天器脱离太阳引力飞出太阳系所需的最小速度。"},{"title":"火箭为什么能飞","body":"火箭向后高速喷出燃气，靠反作用力获得向前推力。真空中没有空气可“蹬”，但反作用力照样成立。"},{"title":"空间站高度","body":"中国空间站运行在约 400 公里的近地轨道，属于低地球轨道，绕地球一圈大约 90 分钟。"},{"title":"神舟与天舟","body":"神舟飞船负责航天员往返，天舟货运飞船负责运送物资与推进剂，两者分工不同。"},{"title":"玉兔与祝融","body":"我国的月球车名为“玉兔”，火星车名为“祝融”，分别执行月球与火星表面探测任务。"},{"title":"太空育种","body":"把种子送上太空，利用宇宙辐射与微重力诱发变异，返回地面后再筛选优良性状，这就是航天育种。"},{"title":"最深的海","body":"马里亚纳海沟最深处约 11000 米，是地球海洋的最深处，也是人类探索的最极端环境之一。"},{"title":"蛟龙号","body":"我国“蛟龙”号载人潜水器最大下潜深度约 7062 米，“奋斗者”号则把纪录推进到 10909 米。"},{"title":"深海热液","body":"深海热液喷口附近没有阳光，却有以化学能为基础的独特生态系统，为研究生命起源提供了线索。"},{"title":"钛合金球舱","body":"深海载人潜水器的载人球舱常用高强度钛合金制造，以在极高压环境下保证结构安全。"},{"title":"海水压力","body":"海水深度每增加约 10 米，压力大约增加 1 个大气压，这是估算深海压力的简便方法。"},{"title":"锂电池负极","body":"锂离子电池负极常用石墨材料，充放电时锂离子在正负极之间来回嵌入与脱出，因此被称为“摇椅电池”。"},{"title":"磷酸铁锂","body":"磷酸铁锂正极材料热稳定性较好、循环寿命较长，常用于对安全性和寿命要求高的场景。"},{"title":"光伏发电","body":"太阳能电池利用光生伏特效应，把光能直接转换成电能，过程中没有燃烧、不产生废气。"},{"title":"氢能","body":"氢气燃烧的产物主要是水，被视为清洁能源载体，但制取、储存和运输仍是需要攻关的环节。"},{"title":"风力发电","body":"风力发电把风能转成机械能再转成电能，属于可再生能源，选址高度依赖风资源分布。"},{"title":"特高压输电","body":"特高压输电可以显著降低长距离线路损耗，适合把西部能源输送到东部负荷中心。"},{"title":"癫痫","body":"癫痫是慢性神经系统疾病，由大脑神经元异常同步放电引起，需要长期规范治疗与管理。"},{"title":"伦理审查","body":"涉及人的医学研究在开展前必须通过伦理委员会审查，保障受试者的知情同意与安全。"},{"title":"疫苗原理","body":"疫苗让免疫系统提前“认识”病原体，形成免疫记忆，真正感染时能更快更有效地应答。"},{"title":"壁画病害","body":"起甲、酥碱、空鼓是壁画常见病害。酥碱与盐分迁移有关，起甲则表现为颜料层翘起脱落。"},{"title":"预防性保护","body":"预防性保护强调监测并控制温湿度、光照和污染物，在病害发生前干预，而不是等损坏后再修复。"},{"title":"无损检测","body":"X 射线、红外热像、激光拉曼等技术可以在不接触或微损的情况下分析文物材质与内部结构。"},{"title":"水体富营养化","body":"氮磷等营养物质过量进入水体，会导致藻类暴发、溶解氧下降，进而破坏水生态，这就是富营养化。"},{"title":"就地与迁地保护","body":"就地保护是在原生环境建立保护区，迁地保护是把物种移到植物园、种质库异地保存，两者常配合使用。"}],"quiz":[{"q":"黄芊芊主要从事哪个领域的研究？","options":["超低功耗微纳电子器件","卫星导航","深海装备"],"answer":0,"explain":"她深耕后摩尔时代超低功耗微纳电子器件研究，2023 年获中国青年女科学家奖。"},{"q":"黄芊芊获得的是第几届中国青年女科学家奖？","options":["第十六届","第十七届","第十八届"],"answer":2,"explain":"2023 年她获得第十八届中国青年女科学家奖。"},{"q":"黄芊芊多少岁被聘为北京大学博士生导师？","options":["24 岁","28 岁","32 岁"],"answer":1,"explain":"她 17 岁考入北大，28 岁被聘为博士生导师。"},{"q":"徐颖主要参与的卫星导航系统是？","options":["GPS","伽利略","北斗"],"answer":2,"explain":"她 2006 年起参与北斗二号系统研究，长期从事北斗增强与终端技术研究。"},{"q":"网友给徐颖起的称号是？","options":["北斗女神","航天女神","深海女神"],"answer":0,"explain":"因科普风格，她被网友称为“北斗女神”，但她更希望大家关注北斗系统本身。"},{"q":"徐颖 2015 年成为当时中科院最年轻的什么？","options":["院士","博士生导师之一","所长"],"answer":1,"explain":"2015 年她成为当时中科院最年轻的博士生导师之一。"},{"q":"桂海潮在中国空间站担任什么角色？","options":["指令长","首位载荷专家","飞行工程师"],"answer":1,"explain":"他是中国空间站首位载荷专家。"},{"q":"桂海潮任务期间完成了多少项空间科学实验？","options":["28 项","48 项","68 项"],"answer":2,"explain":"任务期间完成 68 项空间科学实验，涵盖微重力流体物理、材料制备、生命科学等。"},{"q":"赵洋是哪台潜水器的副总设计师？","options":["蛟龙号","奋斗者号","深海勇士号"],"answer":1,"explain":"他是“奋斗者”号全海深载人潜水器副总设计师。"},{"q":"“奋斗者”号 2020 年下潜的最深纪录是多少米？","options":["7062 米","9090 米","10909 米"],"answer":2,"explain":"2020 年 11 月，“奋斗者”号下潜至 10909 米马里亚纳海沟。"},{"q":"赵洋负责攻关的是潜水器的哪一部分？","options":["推进器","控制系统","照明系统"],"answer":1,"explain":"他带领团队完成“奋斗者”号控制系统的自主研制。"},{"q":"金海族所在的企业是？","options":["宁德时代","比亚迪","中创新航"],"answer":0,"explain":"她是宁德时代航空和机器人电池技术中心部长。"},{"q":"金海族 2021 年启动研发的系统是？","options":["电芯 AI 智能设计系统","换电网络","氢燃料电池"],"answer":0,"explain":"她推动研发模式从“经验驱动”转向“数据与 AI 驱动”。"},{"q":"陈蕾所在的医院是？","options":["协和医院","华西医院","瑞金医院"],"answer":1,"explain":"她是四川大学华西医院主任医师。"},{"q":"陈蕾团队创建的本体库针对哪类患者？","options":["女性癫痫患者","糖尿病患者","肿瘤患者"],"answer":0,"explain":"团队创建了全球首个女性癫痫诊疗本体库。"},{"q":"于宗仁所在的机构是？","options":["故宫博物院","敦煌研究院","国家博物馆"],"answer":1,"explain":"他是敦煌研究院保护研究所所长。"},{"q":"于宗仁提出的文物保护“三可”目标是？","options":["看得清、摸得透、管得住","看得远、守得稳、传得开","修得旧、保得久、展得广"],"answer":0,"explain":"他提出“看得清、摸得透、管得住”的科研目标。"},{"q":"黄桂云主要保护的是哪一类资源？","options":["珍稀植物","古建筑","野生动物"],"answer":0,"explain":"她 30 多年守护三峡珍稀植物，牵头保护濒危特有植物 2130 余种。"},{"q":"孔海南长期驻守治理的湖泊是？","options":["太湖","洱海","洞庭湖"],"answer":1,"explain":"他每年驻守洱海超过 200 天，完成 3 万次采样、16 万次水质分析。"},{"q":"苏权科担任的职务是？","options":["港珠澳大桥工程总工程师","杭州湾大桥设计师","青藏铁路总 /* ---------- 状态 ---------- */
const KEY='zhuiguang_web_v1';
function blank(){ return {points:0,days:{},read:[],wrong:[],fav:[],salt:0,
  daily:{},cat:{},wrongrun:{},person:{},challenge:{},ui:{font:0,dark:0}}; }
let S;
function load(){ try{ S = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ S=blank(); }
  for(const k in blank()) if(S[k]===undefined) S[k]=blank()[k];
  if(!S.salt){ S.salt = 100000 + Math.floor(Math.random()*900000); save(); } }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
load();

/* ---------- 工具 ---------- */
const pad=n=>String(n).padStart(2,'0');
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayNum(d){ const x=d||new Date(); return Math.floor(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())/864e5); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,rnd){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }
function badgeName(p){ p=p===undefined?S.points:p;
  return p>=300?'掌灯人':p>=150?'引路人':p>=50?'追光者':'追光新星'; }
function nextTh(p){ p=p===undefined?S.points:p;
  return p>=300?300:p>=150?300:p>=50?150:50; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function checkedToday(){ return !!S.days[today()]; }
function addPoints(n){ S.points += n; }

/* ---------- 提示 ---------- */
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%);'+
      'background:rgba(20,28,48,.92);color:#fff;font-size:.78em;padding:10px 16px;border-radius:14px;'+
      'z-index:120;max-width:80%;text-align:center;transition:opacity .2s;opacity:0';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity='0',1600);
}
function openSheet(html){ document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

/* ---------- 顶栏/导航 ---------- */
function renderTop(){
  const d=new Date();
  document.getElementById('today').textContent =
    (d.getMonth()+1)+'月'+d.getDate()+'日 · 周'+'日一二三四五六'[d.getDay()];
  document.body.classList.toggle('dark', S.ui.dark===1 ||
    (S.ui.dark===0 && matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.style.setProperty('--fs',
    S.ui.font===2?'18.5px':(S.ui.font===1?'17.4px':'16px'));
}
function renderNav(){
  const items=[['person','人物'],['book','每日一学'],['check','打卡'],['star','我的']];
  document.getElementById('nav').innerHTML = items.map((it,i)=>
    `<div class="${app.tab===i?'on':''}" onclick="show(${i})">
       ${ICONS[it[0]]}${it[1]}</div>`).join('');
}

const app={tab:0};
function show(i){ app.tab=i; render(); }

  const p=document.querySelector('.pager'); if(!p) return;

/* ---------- 人物 ---------- */
let filter='全部';
function pagePeople(){
  const fields=['全部',...new Set(DATA.people.map(p=>p.field))];
  const list=DATA.people.map((p,i)=>({p,i})).filter(o=>filter==='全部'||o.p.field===filter);
  return `<div class="chips">${fields.map(f=>
      `<div class="chip ${f===filter?'on':''}" onclick="setFilter('${esc(f)}')">${esc(f)}</div>`).join('')}</div>
    <div class="pager">${list.map(o=>{
      const p=o.p, ph=PHOTOS[p.name];
      return `<div class="pcard" onclick="openPerson(${o.i})">
        <div class="top">${ph?`<img src="${ph}" alt="">`:`<div class="init">${esc(p.name[0])}</div>`}</div>
        <div class="body">
          <h3>${esc(p.name)}</h3>
          <span class="f">${esc(p.field)}</span>
          <div class="b">${esc(p.brief)}</div>
        </div></div>`;
    }).join('')}</div>
    <div class="foot">共 ${list.length} 位 · 左右滑动查看 · 点卡片看详情</div>`;
}
function setFilter(f){ filter=f; render(); }
function openPerson(i){

function pageCheckin(){
  const t=today(), done=checkedToday();
  const days=Object.keys(S.days).sort();
  const total=days.length;
  let streak=0; const d=new Date();
  while(S.days[dayKey(d)]){ streak++; d.setDate(d.getDate()-1); }
  const mdays=days.filter(x=>x.startsWith(t.slice(0,7))).length;
  let longest=0,run=0,prev=null;
  days.forEach(x=>{ const dt=new Date(x+'T00:00:00');
    if(prev && (dt-prev)/864e5===1) run++; else run=1;
    longest=Math.max(longest,run); prev=dt; });

  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1).getDay(), cnt=new Date(y,m+1,0).getDate();
  let cal='日一二三四五六'.split('').map(x=>`<div class="hd">${x}</div>`).join('');
  for(let i=0;i<first;i++) cal+='<div></div>';
  for(let i=1;i<=cnt;i++){ const k=`${y}-${pad(m+1)}-${pad(i)}`;
    cal+=`<div class="${S.days[k]!==undefined?'ok':''}">${i}</div>`; }

  const cands=makeupCandidates();
  return `<div class="card">
      <div style="font-size:1.02em;font-weight:700">${done?'今天已经打过卡了':'今天还没有打卡'}</div>
      <div class="mut" style="margin-top:6px">${done?esc(S.days[t]||'（没有写心得）'):'打卡 +10 分，顺手写一句今天的学习心得'}</div>
      ${done?'':`<button class="btn" style="margin-top:14px" onclick="doCheckin()">今日打卡 +10 分</button>`}
    </div>
    <div class="stat">
      <div class="c"><b>${streak}</b><span>连续打卡</span></div>
      <div class="c"><b>${total}</b><span>累计天数</span></div>
      <div class="c"><b>${mdays}</b><span>本月打卡</span></div>
      <div class="c"><b>${longest}</b><span>最长连续</span></div>
    </div>
    <div class="card"><div class="sec" style="margin-top:0">${m+1} 月打卡日历</div><div class="cal">${cal}</div></div>
    ${cands.length?`<button class="btn ghost" onclick="pickMakeup()">补签打卡（消耗 20 分 / 天）</button>`:''}
    <div class="foot">打卡数据保存在本机浏览器，不上传任何服务器。</div>`;
}
function makeupCandidates(){
  const out=[];
  for(let i=1;i<=3;i++){ const d=new Date(); d.setDate(d.getDate()-i);
    const k=dayKey(d); if(!S.days[k]) out.push(k); }
  return out;
}

/* ---------- 热力图 ---------- */
const HEAT_WEEKS=12;
function heatStart(){
  const sun=new Date(); sun.setHours(0,0,0,0); sun.setDate(sun.getDate()-sun.getDay());
  const s=new Date(sun); s.setDate(sun.getDate()-7*(HEAT_WEEKS-1)); return s;
}
function dayStats(k){
  const r={check:false,quiz:0,cat:0,person:0,ch:0,wrong:0,note:'',score:0};
  if(S.days[k]!==undefined){ r.check=true; r.note=S.days[k]||''; }
  if(S.daily[k]!==undefined) r.quiz=1;
  const pre=k+'_';
  Object.keys(S.cat).forEach(x=>{ if(x.indexOf(pre)===0) r.cat++; });
  Object.keys(S.person).forEach(x=>{ if(x.indexOf(pre)===0) r.person++; });
  if(S.wrongrun[k]!==undefined) r.wrong=1;
  r.ch=S.challenge[k]||0;
  r.score=(r.check?1:0)+r.quiz+r.cat+r.person+r.wrong+Math.min(3,r.ch);
  return r;
}
function heatLevel(n){ return n<=0?0:(n<=1?1:(n<=3?2:3)); }
function heatMonths(){
  const s=heatStart(); let last=-1; const cells=[];
  for(let w=0;w<HEAT_WEEKS;w++){
    const d=new Date(s); d.setDate(s.getDate()+w*7); const m=d.getMonth();
    if(m!==last){ cells.push(`<i>${m+1}月</i>`); last=m; } else cells.push('<i></i>');
  }
  return `<div class="heatMon">${cells.join('')}</div>`;
}
function heatmap(){
  const s=heatStart(), tk=today(), out=[];
  for(let i=0;i<HEAT_WEEKS*7;i++){
    const d=new Date(s); d.setDate(s.getDate()+i); const k=dayKey(d);
    if(k>tk){ out.push('<i class="fut"></i>'); continue; }
    const lv=heatLevel(dayStats(k).score);
    const cls=(lv?'lv'+lv:'')+(k===tk?' td':'');
    out.push(`<i class="${cls}" onclick="heatTap('${k}')"></i>`);
  }
  return `<div class="heat">${out.join('')}</div>`;
}
function heatLegend(){
  const s=heatStart(), tk=today(); let days=0, active=0;
  for(let i=0;i<HEAT_WEEKS*7;i++){
    const d=new Date(s); d.setDate(s.getDate()+i); const k=dayKey(d);
    if(k>tk) continue;
    if(S.days[k]!==undefined) days++;
    if(dayStats(k).score>0) active++;
  }
  return `<div class="heatLg"><span>少</span><i class="lv0"></i><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><span>多</span>
    <span style="margin-left:auto">近 12 周：打卡 ${days} 天 · 活跃 ${active} 天</span></div>
    <div class="mut" style="margin-top:6px">格子里颜色越深表示当天学习越多（打卡 / 答题 / 挑战），点任意格子可看当天明细。</div>`;
}
function heatTap(k){
  const r=dayStats(k), title=(+k.split('-')[1])+' 月 '+(+k.split('-')[2])+' 日';
  const rows=[];
  if(r.check) rows.push(['使命担当打卡','已打卡']);
  if(r.quiz) rows.push(['每日一测','3 题']);
  if(r.cat) rows.push(['分类练习',r.cat+' 组']);
  if(r.person) rows.push(['TA 的题',r.person+' 组']);
  if(r.wrong) rows.push(['错题重练','1 组']);
  if(r.ch) rows.push(['限时挑战',r.ch+' 局']);
  if(!rows.length){
    openSheet(`<h2>${title}</h2><div class="mut">这一天没有学习记录。</div>
      <button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">关闭</button>`);
    return;
  }
  openSheet(`<h2>${title}</h2>
    ${rows.map(x=>`<div class="item"><span style="float:right;color:var(--primary);font-weight:700">${x[1]}</span>${x[0]}</div>`).join('')}
    ${r.note?`<div class="sec">当日心得</div><div class="item mut">${esc(r.note)}</div>`:''}
    <button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">关闭</button>`);
}

/* ---------- 答题 ---------- */
let QZ={};
function startQuiz(mode,arg){
  let list=[];
  const rndDaily=mulberry32(dayNum()*1000003 + S.salt);
  if(mode==='daily'){
    const ids=shuffle(DATA.quiz.map((_,i)=>i),rndDaily);
    list=ids.slice(0,3).map(i=>DATA.quiz[i]);
  } else if(mode==='cat'){
    const pool=DATA.quiz.map((q,i)=>({q,i})).filter(o=>o.q.cat===arg).map(o=>o.q);
    list=shuffle(pool,mulberry32(dayNum()*1000003 + arg*7919 + S.salt)).slice(0,5);
  } else if(mode==='person'){
    const pool=DATA.quiz.filter(q=>q.q.includes(arg));
    list=shuffle(pool,mulberry32(Date.now()%1e7)).slice(0,3);
  } else if(mode==='wrong'){
    const stones=S.wrong.slice(0,10);
    list=stones.map(t=>DATA.quiz.find(q=>q.q===t)).filter(Boolean);
    list=shuffle(list,mulberry32(Date.now()%1e7));
  }
  if(!list.length){ toast('没有可练习的题目'); return; }
  QZ={mode,arg,list,idx:0,score:0,answered:false};
  renderQuiz();
}
function quizTitle(){
  if(QZ.mode==='daily') return '每日一测';
  if(QZ.mode==='cat') return CAT_NAMES[QZ.arg];
  if(QZ.mode==='person') return QZ.arg+' 的题';
  return '错题重练';
}
function renderQuiz(){
  const q=QZ.list[QZ.idx], qq=esc(q.q);
  const opts=q.options.map((o,i)=>
    `<button class="opt" id="o${i}" onclick="answerQuiz(${i})">${'ABC'[i]}　${esc(o)}</button>`).join('');
  openSheet(`<h2>${quizTitle()} · ${QZ.idx+1}/${QZ.list.length}</h2>
    <div class="q">${qq}</div>${opts}<div id="qzExtra"></div>`);
  QZ.answered=false;
}
function answerQuiz(i){
  if(QZ.answered) return; QZ.answered=true;
  const q=QZ.list[QZ.idx], ok=i===q.answer;
  if(ok) QZ.score++;
  else if(!S.wrong.includes(q.q)) S.wrong.push(q.q);
  if(ok && QZ.mode==='wrong') S.wrong=S.wrong.filter(x=>x!==q.q);
  document.getElementById('o'+q.answer).classList.add('ok');
  if(!ok) document.getElementById('o'+i).classList.add('no');
  const noPts=quizNoPoints();
  const tip=ok?(noPts?'答对了（今天已练过，本局不计分）':'答对了 +2 分'):'再想想（已记入错题本）';
  document.getElementById('qzExtra').innerHTML=
    `<div class="exp">${tip}<br><br>${esc(q.explain||'')}</div>
     <button class="btn" onclick="nextQuiz()">${QZ.idx+1<QZ.list.length?'下一题':'查看成绩'}</button>`;
  save();
}
function quizNoPoints(){
  if(QZ.mode==='cat') return S.cat[today()+'_'+QZ.arg]!==undefined;
  if(QZ.mode==='wrong') return S.wrongrun[today()]!==undefined;
  if(QZ.mode==='person') return S.person[today()+'_'+QZ.arg]!==undefined;
  return false;
}
function nextQuiz(){
  if(QZ.idx+1<QZ.list.length){ QZ.idx++; renderQuiz(); } else finishQuiz();
}
function finishQuiz(){
  let gained=QZ.score*2, note='';
  const t=today();
  if(QZ.mode==='daily'){
    if(S.daily[t]===undefined){ S.daily[t]=QZ.score; addPoints(gained); }
    else { gained=0; }
  } else if(QZ.mode==='cat'){
    const k=t+'_'+QZ.arg;
    if(S.cat[k]===undefined){ S.cat[k]=QZ.score; addPoints(gained); }
    else { gained=0; note='今天已经练过'+CAT_NAMES[QZ.arg]+'，本局不计积分（明天可再得）'; }
  } else if(QZ.mode==='wrong'){
    if(S.wrongrun[t]===undefined){ S.wrongrun[t]=QZ.score; addPoints(gained); }
    else { gained=0; note='今天已经练过错题本，本局不计积分（明天可再得）'; }
  } else if(QZ.mode==='person'){
    const k=t+'_'+QZ.arg;
    if(S.person[k]===undefined){ S.person[k]=QZ.score; addPoints(gained); }
    else { gained=0; note='今天已经练过 TA 的题，本局不计积分（明天可再得）'; }
  }
  save();
  openSheet(`<div class="result"><b>${QZ.score} / ${QZ.list.length}</b>
      <span>${QZ.score===QZ.list.length?'全部答对，追光者！':(QZ.score*2>=QZ.list.length?'不错，继续保持':'再看看每日一学吧')}</span></div>
    <div class="mut" style="text-align:center">${gained>0?'积分 +'+gained:'本局积分 +0'} · 当前 ${S.points} 分 · ${badgeName()}<br>
      错题本共 ${S.wrong.length} 题${note?'<br>'+note:''}</div>
    <button class="btn" style="margin-top:14px" onclick="closeSheet();render()">完成</button>`);
}

/* ---------- 限时挑战 ---------- */
let CH={};
function startChallenge(){
  if(CH.timer) clearInterval(CH.timer);
  CH={pool:shuffle(DATA.quiz,mulberry32(Date.now()%1e7)),idx:0,score:0,left:60,finished:false};
  renderChallenge();
  CH.timer=setInterval(()=>{
    if(CH.finished) return;
    CH.left--;
    const el=document.getElementById('chTime');
    if(el) el.textContent='剩余 '+CH.left+' 秒 · 得分 '+CH.score;
    if(CH.left<=0) finishChallenge();
  },1000);
}
function renderChallenge(){
  if(CH.finished) return;
  const q=CH.pool[CH.idx % CH.pool.length];
  CH.current=q;
  openSheet(`<h2 id="chTime">剩余 ${CH.left} 秒 · 得分 ${CH.score}</h2>
    <div class="q">${esc(q.q)}</div>
    ${q.options.map((o,i)=>`<button class="opt" onclick="answerChallenge(${i})">${'ABC'[i]}　${esc(o)}</button>`).join('')}`);
}
function answerChallenge(i){
  if(CH.finished || CH.lock) return;
  CH.lock=true;
  const q=CH.current;
  if(i===q.answer) CH.score++; else if(!S.wrong.includes(q.q)) S.wrong.push(q.q);
  CH.idx++; save();
  if(CH.left<=0){ CH.lock=false; finishChallenge(); return; }
  setTimeout(()=>{ CH.lock=false; if(!CH.finished) renderChallenge(); },180);
}
function finishChallenge(){
  if(CH.finished) return;
  CH.finished=true; CH.lock=false; clearInterval(CH.timer);
  const t=today(); const n=S.challenge[t]||0;
  let gained=0, counted=false;
  if(n<3){ S.challenge[t]=n+1; gained=CH.score*2; addPoints(gained); counted=true; }
  save();
  openSheet(`<div class="result"><b>${CH.score}</b>
      <span>${CH.score>=15?'追光如飞':(CH.score>=8?'表现不错':'再练练手')}</span></div>
    <div class="mut" style="text-align:center">60 秒答对 ${CH.score} 题 · ${counted?'积分 +'+gained:'本局积分 +0'}<br>
      当前 ${S.points} 分 · ${badgeName()}${counted?'':'<br>今天已完成 '+n+'/3 局计分，后续对局不计积分（明天可再得）'}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeSheet();render()">完成</button>
      <button class="btn" onclick="closeSheet();startChallenge()">再来一局</button></div>`);
}

/* ---------- 备份 ---------- */
function exportJSON(){
  const o={points:S.points, days:Object.keys(S.days), read:S.read, wrong:S.wrong,
    fav:S.fav, notes:{}, version:1};
  Object.keys(S.days).forEach(d=>{ if(S.days[d]) o.notes[d]=S.days[d]; });
  return JSON.stringify(o,null,2);
}
function exportBackup(){
  const name='追光者备份_'+today()+'.json';
  saveFile(new Blob([exportJSON()],{type:'application/json'}),name);
}
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const o=JSON.parse(r.result);
        S.points=o.points||0;
        S.days={}; (o.days||[]).forEach(d=>S.days[d]='');
        Object.keys(o.notes||{}).forEach(d=>{ if(S.days[d]===undefined) S.days[d]=''; S.days[d]=o.notes[d]; });
        S.read=o.read||[]; S.wrong=o.wrong||[]; S.fav=o.fav||[];
        save(); render(); toast('导入成功，共 '+Object.keys(S.days).length+' 天打卡记录');
      }catch(e){ toast('备份文件格式不正确'); } };
    r.readAsText(f); };
  inp.click();
}

/* ---------- 分享卡 / 报告长图 ---------- */
function dataURLtoBlob(d){
  const p=d.split(','), m=/:(.*?);/.exec(p[0])[1], bin=atob(p[1]);
  const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:m});
}
/* iOS 主屏模式下 <a download> 常常点了没反应，优先走系统分享面板（可存到「文件」/相册/微信）。
   桌面浏览器仍然直接下载，不然每次都会弹出系统分享窗口。 */
function saveFile(blob,name){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches;
  try{
    if(ios || standalone || navigator.standalone){
      const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name})
          .then(()=>toast('已打开分享面板，选「存储到文件」即可'))
          .catch(()=>{});
        return;
      }
    }
  }catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  toast('已导出：'+name);
}
function downloadCanvas(cv,name){
  /* 同步生成 blob，保住 iOS 的用户手势上下文，否则 navigator.share 会被拒绝 */
  let blob=null;
  try{ blob=dataURLtoBlob(cv.toDataURL('image/png')); }catch(e){}
  if(blob) saveFile(blob,name); else toast('图片生成失败，请重试');
}
function shareCard(i){
  const p=DATA.people[i];
  const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350;
  const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,1080,500); g.addColorStop(0,'#5C87FF'); g.addColorStop(1,'#12215E');
  c.fillStyle=g; c.fillRect(0,0,1080,500);
  c.fillStyle='#F4F6FB'; c.fillRect(0,500,1080,850);
  c.fillStyle='#B8C8FF'; c.font='34px sans-serif'; c.fillText('追光者 · 科技青年志',60,90);
  c.fillStyle='#fff'; c.font='bold 72px sans-serif'; c.fillText(p.name,60,220);
  c.font='30px sans-serif'; c.fillStyle='#D6E1FF'; c.fillText(p.field,60,275);
  wrapText(c,p.brief,60,340,960,40,30,'#E8EEFF');
  c.fillStyle='#1B2233'; c.font='bold 36px sans-serif'; c.fillText('人物事迹',60,560);
  wrapText(c,p.detail,60,620,960,48,30,'#4A5266');
  c.fillStyle='#2B5CE6'; c.font='30px sans-serif'; c.fillText('“以青年之光，照科技之路”',60,1240);
  c.fillStyle='#9AA4B8'; c.font='22px sans-serif'; c.fillText('资料来源：'+p.source,60,1300);
  downloadCanvas(cv,'追光者-'+p.name+'.png');
}
function wrapText(c,text,x,y,maxW,lh,size,color){
  c.font=size+'px sans-serif'; c.fillStyle=color;
  let line='',yy=y;
  for(const ch of text){
    if(c.measureText(line+ch).width>maxW){ c.fillText(line,x,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  c.fillText(line,x,yy);
  return yy;
}
function makeReport(){
  const cv=document.createElement('canvas'); cv.width=1080; cv.height=1600;
  const c=cv.getContext('2d');
  c.fillStyle='#F4F6FB'; c.fillRect(0,0,1080,1600);
  const g=c.createLinearGradient(0,0,1080,560); g.addColorStop(0,'#5C87FF'); g.addColorStop(1,'#12215E');
  c.fillStyle=g; c.beginPath(); c.roundRect(0,0,1080,560,40); c.fill();
  c.fillStyle='#B8C8FF'; c.font='34px sans-serif'; c.fillText('追光者 · 科技青年志',60,100);
  c.fillStyle='#fff'; c.font='38px sans-serif'; c.fillText('我的学习报告',60,170);
  c.font='bold 120px sans-serif'; c.fillText(String(S.points),60,350);
  c.font='36px sans-serif'; c.fillStyle='#B8C8FF';
  c.fillText('分 · '+badgeName(),60+c.measureText(String(S.points)).width+60,350);
  c.font='30px sans-serif'; c.fillStyle='#fff';
  c.fillText('打卡 '+Object.keys(S.days).length+' 天    已读人物 '+S.read.length+'/'+DATA.people.length
    +'    错题 '+S.wrong.length+' 题',60,440);
  const rows=[['累计打卡',Object.keys(S.days).length+' 天'],
    ['已读人物',S.read.length+' / '+DATA.people.length+' 位'],
    ['今日答题',(S.daily[today()]!==undefined?S.daily[today()]+' / 3 题':'未作答')],
    ['错题本',S.wrong.length+' 题'],['收藏',S.fav.length+' 项']];
  let y=620;
  rows.forEach(([k,v])=>{
    c.fillStyle='#fff'; c.beginPath(); c.roundRect(60,y,960,110,24); c.fill();
    c.fillStyle='#5D6478'; c.font='32px sans-serif'; c.fillText(k,100,y+70);
    c.fillStyle='#2B5CE6'; c.font='36px sans-serif';
    c.fillText(v,1040-c.measureText(v).width,y+72); y+=130;
  });
  const notes=Object.keys(S.days).sort().reverse().filter(d=>S.days[d]).slice(0,2);
  if(notes.length){
    c.fillStyle='#1B2233'; c.font='32px sans-serif'; c.fillText('最近心得',60,y+20); y+=60;
    notes.forEach(d=>{
      c.fillStyle='#fff'; c.beginPath(); c.roundRect(60,y,960,150,24); c.fill();
      c.fillStyle='#4A5266'; c.font='28px sans-serif';
      const t=S.days[d].length>22?S.days[d].slice(0,22)+'…':S.days[d];
      c.fillText(t,100,y+66);
      c.fillStyle='#9AA4B8'; c.font='24px sans-serif'; c.fillText(d,100,y+112); y+=170;
    });
  }
  c.fillStyle='#9AA4B8'; c.font='26px sans-serif';
  c.fillText('生成于 '+today()+' · 追光者 v5.1 Web',60,1560);
  downloadCanvas(cv,'追光者学习报告_'+today()+'.png');
}

/* ---------- 竖屏锁 ---------- */
function checkOrientation(){
  const touch='ontouchstart' in window || navigator.maxTouchPoints>0;
  const landscape=window.innerWidth>window.innerHeight;
  document.getElementById('rotate').style.display=(touch&&landscape)?'flex':'none';
}
window.addEventListener('resize',checkOrientation);
window.addEventListener('orientationchange',()=>setTimeout(checkOrientation,120));

/* ---------- 启动 ---------- */
checkOrientation();
render();

/* ---------- 前台恢复：主屏 PWA 会长期挂在内存里，跨天后必须重算 ---------- */
let _curDay = today();
function onResume(){
  checkOrientation();
  if(today() !== _curDay){
    _curDay = today();
    render();
    toast('新的一天，记得打卡');
    return;
  }
  renderTop();
  if(window.__swReg && window.__swReg.update) window.__swReg.update();
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden) onResume(); });
window.addEventListener('pageshow', function(e){ if(e.persisted) onResume(); });
if(window.matchMedia){
  const mq=matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', renderTop);
}

/* ---------- 存储持久化：降低 iOS 自动清理缓存的概率 ---------- */
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

/* ---------- PWA：注册离线缓存（只在 http/https 下生效，本地文件打开时自动跳过） ---------- */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  let hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadCtrl){ hadCtrl = true; return; }
    toast('已更新到最新版本');
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function(reg){
      window.__swReg = reg;
      if(reg.update) reg.update();
      setInterval(function(){ if(reg.update) reg.update(); }, 30*60*1000);
    }).catch(function(){});
  });
}
